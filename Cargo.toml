[package]
name = "self-healing"
version = "0.1.0"
edition = "2021"
authors = ["Sorabbyngo OS Team"]
description = "Autonomous fault detection and recovery for Sorabbyngo OS"

[dependencies]
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
zbus = "4"
procfs = "0.16"
